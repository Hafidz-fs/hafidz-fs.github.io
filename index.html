<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Permintaan Maaf</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="profile">
    <img src="https://i.pravatar.cc/80" alt="profile">
      <div>
        <h5>Hafidz</h5>
        <p>Front-end</p>
      </div>
  </nav>
  <main>
    <div class="wrapper">
    <div class="container">
      <div class="hero">
        <div class="hero-text">
          <div class="herosub">
          <h1>First WEB...    
            <span id="element"></span></h1>
          </div>
          <p>
          Ini adalah web pertama saya dan saya gunakan untuk keperluan pribadi seperti tugas dan lain-lain saya harap ini tidak terlalu buruk untuk ditonton.....
          </p>
        </div>
        <button class="btn-submit">
          <a class="text" href="./content/content.html">MASUK</a>
        </button>
      </div>
    </div>
    </div>
  </main>
  <script src="https://unpkg.com/typed.js@3.0.0/dist/typed.umd.js"></script>
  <script>
    const typingSound = new Audio("images/typing.mp3");

  // supaya suara bisa diputar berulang
  typingSound.loop = true;

  var typed = new Typed('#element', {
    strings: ["Web Multimedia", "Tugas UAS"],
    typeSpeed: 200,
    backSpeed: 100,
    loop: true,
    showCursor: false,

    // saat mulai mengetik
    preStringTyped: function() {
      typingSound.currentTime = 0;
      typingSound.play();
    },

    // saat selesai satu kalimat
    onStringTyped: function() {
      typingSound.pause();
    },

    // saat mulai menghapus
    onLastStringBackspaced: function() {
      typingSound.pause();
    }
  });
  </script>
</body>
</html>
